name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            output="mcp-cli-$goos-$goarch"
            if [ "$goos" = windows ]; then output="$output.exe"; fi
            GOOS=$goos GOARCH=$goarch go build -ldflags "-X main.version=$VERSION" -o "$output"
          done

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" mcp-cli-*
