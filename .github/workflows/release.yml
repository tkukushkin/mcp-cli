name: Release

on:
  release:
    types: [created]

jobs:
  # macOS needs cgo for Security.framework, so those binaries cannot be cross-compiled from
  # Linux. A macOS runner builds both arches; everything else stays cgo-free on Linux.
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          for goarch in arm64 amd64; do
            GOOS=darwin GOARCH=$goarch \
              go build -ldflags "-X main.version=$VERSION" -o "mcp-cli-darwin-$goarch"
          done

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mcp-cli-darwin-*

  others:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          for target in linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            output="mcp-cli-$goos-$goarch"
            if [ "$goos" = windows ]; then output="$output.exe"; fi
            GOOS=$goos GOARCH=$goarch go build -ldflags "-X main.version=$VERSION" -o "$output"
          done

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mcp-cli-linux-* mcp-cli-windows-*
