name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS carries the cgo Keychain path, Linux the file one; both need running.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -coverprofile=coverage.out ./...

      # Both platforms upload: the Keychain path only compiles on macOS, so a Linux-only
      # report would leave it out of the numbers entirely rather than show it untested.
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
